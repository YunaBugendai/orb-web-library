name: Orb! compiler, WebAssembly and browser tests

on:
  push:
    branches: [main, bundled-standard-library-installer]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build compiler
        run: make
      - name: Native regression tests
        run: make test
      - name: WebAssembly regression tests
        run: make test-wasm
      - name: Install Chromium test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser integration tests
        run: make test-web
      - name: Build browser examples
        run: make web-examples
      - name: Check installer and release packager syntax
        run: python -m py_compile tools/install.py tools/setup.py tools/package-release.py
      - name: Build and inspect Linux release package
        run: |
          python tools/package-vsix.py build/dist
          python tools/package-release.py --version 0.2.0 --platform linux-x86_64 --output-dir build/release-test
          python -c "import tarfile; t=tarfile.open('build/release-test/orb-linux-x86_64.tar.gz'); names=t.getnames(); assert 'bin/orb' in names; assert 'share/orb/examples' in names; assert 'share/orb/docs' in names; print('release archive contents: OK')"
      - name: Check bootstrapper help
        run: python tools/setup.py --help
      - name: Test component-based installation
        run: |
          printf '2,3\n\n' | python tools/install.py --prefix build/install-smoke
          build/install-smoke/bin/orb doctor
