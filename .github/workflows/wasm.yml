name: Orb! WASM and browser tests

on:
  push:
    branches: [web-wasm-implementation]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build compiler
        run: make
      - name: Native regression tests
        run: make test
      - name: WebAssembly regression tests
        run: make test-wasm
      - name: Install Chromium test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser integration tests
        run: make test-web
      - name: Build browser examples
        run: make web-examples
