name: Orb! WASM, browser tests and SDK package

on:
  push:
    branches: [main, productize-orb-web-sdk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build compiler
        run: make
      - name: Native regression tests
        run: make test
      - name: WebAssembly regression tests
        run: make test-wasm
      - name: Install Chromium test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser integration tests
        run: make test-web
      - name: Build browser examples
        run: make web-examples
      - name: Test the installable runtime package
        run: make test-package
      - name: Build runtime package archive
        run: make package-web
      - name: Upload runtime package
        uses: actions/upload-artifact@v4
        with:
          name: orb-web-runtime-0.2.0
          path: build/packages/*.tgz
          if-no-files-found: error
          retention-days: 90
